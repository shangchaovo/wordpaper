<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>连接桌面 App · WordPaper</title>
  <link rel="icon" href="/assets/favicon-32.png" type="image/png">
  <link rel="stylesheet" href="/css/auth.css?v=20261122-glass">
</head>
<body>
  <main class="connect-shell">
    <section class="auth-card connect-card" aria-labelledby="connect-title">
      <div class="connect-brand"><img src="/assets/favicon-128.png" width="44" height="44" alt="">WordPaper</div>
      <span id="connect-mark" class="connect-mark" aria-hidden="true" hidden>✓</span>
      <h1 id="connect-title" tabindex="-1">连接桌面 App</h1>
      <div id="connect-details">
        <p id="connect-user" class="connect-user">正在读取账号…</p>
        <p class="field-hint">核对 App 中的连接码。允许后，这台 App 可同步词库、提醒和复习进度。</p>
        <p id="connect-code" class="connect-code"></p>
      </div>
      <p id="connect-status" class="connect-status" role="status" aria-live="polite"></p>
      <div id="connect-actions" class="connect-actions">
        <button id="connect-approve" type="button" class="submit-auth" disabled>允许这台 App 同步</button>
        <button id="connect-login" type="button" class="send-code-button">更换账号 / 重新登录</button>
      </div>
      <a class="connect-back" href="/">回到网页版</a>
    </section>
  </main>
  <script src="/js/connect.js?v=20261122-glass"></script>
</body>
</html>
