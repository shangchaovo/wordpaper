<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png?v=20261022">
  <title>登录 · WordPaper</title>
  <link rel="stylesheet" href="css/auth.css?v=20261124-cloud">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-intro" aria-labelledby="auth-brand">
      <div class="auth-logo"><img src="assets/favicon-128.png" width="96" height="96" alt=""></div>
      <p class="auth-wordmark">WordPaper</p>
      <h1 id="auth-brand">把今天的单词<br>留在桌面。</h1>
      <p class="intro-copy">登录后，从上次的词库和复习进度继续。</p>
    </section>

    <section class="auth-card">
      <header class="card-heading">
        <h2>登录 WordPaper</h2>
        <p id="auth-intro-help">已有账号请先按原方式登录，再到「账号绑定」添加登录方式。</p>
      </header>

      <button id="desktop-resume" class="submit-auth" type="button" hidden></button>
      <div class="provider-stack" aria-label="第三方账号登录">
        <button id="auth-google" class="provider-button provider-button-google" type="button" data-provider="google" disabled hidden>
          <span class="provider-mark google" aria-hidden="true">G</span>
          <span class="provider-copy"><strong>使用 Google 继续</strong><small>首次使用将自动创建账号</small></span>
          <span class="provider-arrow" aria-hidden="true">›</span>
        </button>
        <button id="auth-github" class="provider-button" type="button" data-provider="github" disabled hidden>
          <span class="provider-mark github" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24"><path fill="currentColor" stroke="none" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></svg></span>
          <span class="provider-copy"><strong>使用 GitHub 继续</strong><small>首次使用将自动创建账号</small></span>
          <span class="provider-arrow" aria-hidden="true">›</span>
        </button>
      </div>
      <section id="desktop-sync" hidden aria-label="云账号登录">
        <button id="desktop-cloud-email" class="send-code-button" type="button">邮箱 / 原账号登录</button>
        <p id="desktop-sync-status" role="status" aria-live="polite"></p>
        <div id="desktop-sync-pending" hidden>
          <p>请在浏览器核对连接码</p><p id="desktop-sync-code" class="connect-code"></p>
          <a id="desktop-sync-open" href="#" target="_blank" rel="noopener">重新打开授权页面</a>
          <input id="desktop-sync-address" type="text" aria-label="浏览器授权地址" readonly hidden>
          <button id="desktop-sync-cancel" class="text-action" type="button">取消等待</button>
        </div>
      </section>
      <p id="provider-status" class="sr-only" role="status" aria-live="polite"></p>

      <div id="guest-option" class="guest-option">
        <button id="auth-guest" class="provider-button" type="button">
          <span class="provider-mark guest" aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="M8 21h8m-4-4v4"/></svg></span>
          <span class="provider-copy"><strong>以游客身份继续</strong><small>词库和学习记录仅保存在当前浏览器或 App</small></span>
          <span class="provider-arrow" aria-hidden="true">›</span>
        </button>
        <p id="guest-error" class="auth-error" role="alert" hidden></p>
      </div>

      <div class="auth-divider" hidden><span>或使用邮箱</span></div>

      <div id="email-panel" class="email-panel" hidden role="tabpanel" aria-labelledby="tab-login">
        <div class="auth-tabs" role="tablist" aria-label="邮箱账号操作">
          <button id="tab-login" class="auth-tab active" type="button" role="tab" aria-selected="true" aria-controls="email-panel" tabindex="0">登录</button>
          <button id="tab-register" class="auth-tab" type="button" role="tab" aria-selected="false" aria-controls="email-panel" tabindex="-1">注册</button>
        </div>

        <form id="auth-form" novalidate aria-describedby="form-hint auth-error">
          <div class="form-heading">
            <h3 id="form-title">邮箱登录</h3>
            <p id="form-hint">登录后会从服务器恢复你的全部 WordPaper 数据。</p>
          </div>
          <label>
            <span id="identifier-label">邮箱地址或旧用户名</span>
            <input id="username" name="identifier" autocomplete="username" minlength="3" maxlength="254" required placeholder="name@example.com">
          </label>
          <div id="verification-row" class="verification-field" hidden>
            <label for="email-code"><span>邮箱验证码</span></label>
            <div class="verification-control">
              <input id="email-code" name="verificationCode" type="text" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" placeholder="6 位验证码" aria-describedby="email-code-hint">
              <button id="send-email-code" class="send-code-button" type="button">发送验证码</button>
            </div>
            <p id="email-code-hint" class="field-hint" aria-live="polite">验证码 10 分钟内有效。</p>
          </div>
          <label>
            <span>密码</span>
            <input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="至少 8 个字符">
          </label>
          <label id="confirm-row" hidden>
            <span>确认密码</span>
            <input id="password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="8" maxlength="128" placeholder="再次输入密码">
          </label>
          <p id="auth-error" class="auth-error" role="alert" hidden></p>
          <p id="auth-status" class="sr-only" role="status" aria-live="polite"></p>
          <button id="submit-auth" class="submit-auth" type="submit">使用邮箱登录</button>
        </form>
      </div>
      <button id="desktop-legacy-disconnect" class="text-action" type="button" hidden>断开旧连接…</button>
      <dialog id="desktop-disconnect-dialog" aria-labelledby="disconnect-title" aria-describedby="disconnect-copy">
        <h3 id="disconnect-title">允许断开这台 Mac 的旧连接？</h3>
        <p id="disconnect-copy"></p>
        <p>断开前会在本机保存恢复副本。之后可用云账号同步，也可以继续使用游客模式。</p>
        <form method="dialog" class="disconnect-actions">
          <button type="submit" class="send-code-button" value="cancel" autofocus>取消</button>
          <button type="submit" class="submit-auth" value="disconnect">允许断开</button>
        </form>
      </dialog>
      <details id="local-account-options" class="local-account-options" hidden>
        <summary>使用已有的本机账号</summary>
        <section id="desktop-local-google" class="desktop-sync" hidden aria-label="本机 Google 登录">
          <button id="desktop-local-google-sign-in" class="provider-button provider-button-google" type="button">
            <span class="provider-mark google" aria-hidden="true">G</span>
            <span class="provider-copy"><strong>使用 Google 登录本机账号</strong><small>使用已在这台 Mac 绑定的 Google 账号</small></span>
            <span class="provider-arrow" aria-hidden="true">›</span>
          </button>
          <p id="desktop-local-google-status" role="status" aria-live="polite" hidden></p>
          <button id="desktop-local-google-cancel" class="text-action" type="button" hidden>取消授权</button>
        </section>
      </details>
    </section>
  </main>
  <script src="js/guest.js?v=20261124-guest"></script>
  <script src="js/local-google.js?v=20261123-local-google"></script>
  <script src="js/desktop-auth.js?v=20261124-cloud"></script>
  <script src="js/auth.js?v=20261124-cloud"></script>
</body>
</html>
