services:
  wordpaper:
    build: .
    container_name: wordpaper
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WORDPAPER_PORT:-8770}:8770"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8770
      WORDPAPER_MODE: public
      WORDPAPER_DATA_DIR: /data
      WORDPAPER_STORAGE_BACKEND: "${WORDPAPER_STORAGE_BACKEND:-}"
      WORDPAPER_DATABASE_URL: "${WORDPAPER_DATABASE_URL:-}"
      WORDPAPER_STORAGE_ORIGIN: "${WORDPAPER_STORAGE_ORIGIN:-}"
      WORDPAPER_STORAGE_SECRET: "${WORDPAPER_STORAGE_SECRET:-}"
      WORDPAPER_STORAGE_BUCKET: "${WORDPAPER_STORAGE_BUCKET:-wordpaper-backgrounds}"
      WORDPAPER_MODEL_KEY_BASE64: "${WORDPAPER_MODEL_KEY_BASE64:-}"
      WORDPAPER_COMPANION_ENABLED: 0
      WORDPAPER_ADDITIONAL_PUBLIC_ORIGINS: "${WORDPAPER_ADDITIONAL_PUBLIC_ORIGINS:-}"
      WORDPAPER_PUBLIC_ORIGIN: "${WORDPAPER_PUBLIC_ORIGIN:-}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
      WORDPAPER_GOOGLE_CLIENT_ID: "${WORDPAPER_GOOGLE_CLIENT_ID:-}"
      WORDPAPER_GOOGLE_CLIENT_SECRET: "${WORDPAPER_GOOGLE_CLIENT_SECRET:-}"
      WORDPAPER_GOOGLE_REDIRECT_URI: "${WORDPAPER_GOOGLE_REDIRECT_URI:-}"
      WORDPAPER_RESEND_API_KEY: "${WORDPAPER_RESEND_API_KEY:-}"
      WORDPAPER_EMAIL_FROM: "${WORDPAPER_EMAIL_FROM:-}"
    volumes:
      - wordpaper-data:/data

volumes:
  wordpaper-data:
    name: wordpaper-data
