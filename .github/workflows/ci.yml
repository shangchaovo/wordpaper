name: CI

on:
  push:
    branches: [main, 'codex/wordpaper-cloud-candidate-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check
        run: |
          node --check server.js
          node --check companion.js
          for f in js/*.js; do node --check "$f"; done
      - name: Test suite
        run: npm test
      - name: Account, learning and review browser regressions
        run: |
          npm run test:guest
          npm run test:desktop-browser
          npm run test:review-policy
          npm run test:learning

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: wp_test_admin
          POSTGRES_PASSWORD: isolated-ci-database
          POSTGRES_DB: wordpaper_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U wp_test_admin -d wordpaper_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - run: |
          node scripts/test_postgres_backend.js
          node scripts/test_postgres_migration.js
        env:
          WORDPAPER_TEST_DATABASE_URL: postgresql://wp_test_admin:isolated-ci-database@127.0.0.1:${{ job.services.postgres.ports[5432] }}/wordpaper_ci

  cloud-container:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise production Docker image
        run: bash scripts/test_cloud_container.sh

  python-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile check
        run: python -m py_compile scripts/*.py
