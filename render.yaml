services:
  - type: web
    name: wordpaper-api
    runtime: docker
    plan: free
    region: oregon
    autoDeployTrigger: 'off'
    healthCheckPath: /healthz
    envVars:
      - key: WORDPAPER_STORAGE_BACKEND
        value: postgres
      - key: WORDPAPER_DATABASE_URL
        sync: false
      - key: WORDPAPER_MODEL_KEY_BASE64
        sync: false
      - key: WORDPAPER_STORAGE_ORIGIN
        sync: false
      - key: WORDPAPER_STORAGE_SECRET
        sync: false
      - key: WORDPAPER_PUBLIC_ORIGIN
        sync: false
      - key: WORDPAPER_GOOGLE_CLIENT_ID
        sync: false
      - key: WORDPAPER_GOOGLE_CLIENT_SECRET
        sync: false
      - key: WORDPAPER_GOOGLE_REDIRECT_URI
        sync: false
      # GitHub 登录为可选功能。在服务的 Environment 中添加
      # WORDPAPER_GITHUB_CLIENT_ID、WORDPAPER_GITHUB_CLIENT_SECRET 和 WORDPAPER_GITHUB_REDIRECT_URI。
      - key: TRUST_PROXY
        value: '1'
